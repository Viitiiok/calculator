<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <script src="javascript.js" defer> </script>
   <title>Calculator</title>
</head>
<body>
   <div id="calculator-block">

      <div  id="controls-calculator">
         <div class="control close"></div>
         <div class="control minimize"></div>
         <div class="control maximize"></div>
      </div>

      <div id="calculator-output">
         <p>0</p>
      </div>

      <div id="calculator-input"> 
         <div class="row">
            <button style="flex: 3; padding-left: 4px; background-color: #616161;">CLEAR</button>
            <button class="operator">÷</button>
         </div>

         <div class="row">
            <button class="digit">7</button>
            <button class="digit">8</button>
            <button class="digit">9</button>
            <button class="operator">×</button>
         </div>

         <div class="row">
            <button class="digit">4</button>
            <button class="digit">5</button>
            <button class="digit">6</button>
            <button class="operator">-</button>
         </div>

         <div class="row">
            <button class="digit">1</button>
            <button class="digit">2</button>
            <button class="digit">3</button>
            <button class="operator">+</button>
         </div>

         <div class="row">
            <button class="digit" style="flex: 2; padding-left: 2px;">0</button>
            <button class="decimal">.</button>
            <button class="equal">=</button>
         </div>

      </div>

   </div>   

</body>
</html>
